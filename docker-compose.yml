services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://api:8000/api/v1
      BACKEND_INTERNAL_API_KEY: ${BACKEND_INTERNAL_API_KEY:-local-development-key}
      BACKEND_ALLOW_DEMO_PROXY: "false"
      SESSION_COOKIE_SECURE: "false"
      DISABLE_OFFICER_AUTH: ${DISABLE_OFFICER_AUTH:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash}
      GEMINI_RESERVE_MODEL: ${GEMINI_RESERVE_MODEL:-gemini-3.6-flash}
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://triage:triage@db:5432/triage
      FRONTEND_ORIGINS: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      TRACKING_TOKEN_DAYS: ${TRACKING_TOKEN_DAYS:-180}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-before-deployment}
      INTERNAL_API_KEY: ${BACKEND_INTERNAL_API_KEY:-local-development-key}
      DIRECTORY_HASH_SECRET: ${DIRECTORY_HASH_SECRET:-local-directory-hash-secret-change-me}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-only-change-me}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      # Local Compose must never mix test uploads with the production bucket.
      EVIDENCE_STORAGE_BACKEND: local
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.6-flash}
      GEMINI_RESERVE_MODEL: ${GEMINI_RESERVE_MODEL:-gemini-2.5-flash}
      AUTO_CREATE_TABLES: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence_data:/app/data/evidence

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
    volumes:
      - triage_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  triage_data:
  evidence_data:
