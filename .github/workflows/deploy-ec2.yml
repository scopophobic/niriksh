name: Verify and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: niriksh-ec2-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: pip install -r backend/requirements.txt
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/niriksh-ci.db
          EVIDENCE_STORAGE_BACKEND: local
        run: pytest -q

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            dockerfile: ./Dockerfile
            repository: niriksh-web
          - component: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            repository: niriksh-api
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: test -n "$AWS_REGION" && test -n "$AWS_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64
          provenance: true
          sbom: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: test -n "$AWS_REGION" && test -n "$AWS_ROLE_ARN" && test -n "$EC2_INSTANCE_ID"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" '{commands:[
            "sudo -u niriksh git -C /opt/niriksh/source fetch --prune origin main",
            "sudo -u niriksh git -C /opt/niriksh/source checkout main",
            "sudo -u niriksh git -C /opt/niriksh/source merge --ff-only origin/main",
            "sudo /opt/niriksh/source/scripts/install-ec2-runtime.sh",
            ("sudo /opt/niriksh/runtime/deploy.sh " + $sha)
          ]}' > /tmp/ssm-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Niriksh $GITHUB_SHA" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Deployment did not finish within ten minutes." >&2
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" || true
          exit 1
